server {
    listen 80;
    server_name localhost;

    # Resolver DNS de Docker en cada petición: Nginx arranca aunque Joomla/Jupyter/Grafana
    # todavía no estén listos (evita "host not found in upstream").
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $joomla_up  http://joomla:80;
    set $jupyter_up http://jupyter:8888;
    set $grafana_up http://grafana:3000;

    location / {
        proxy_pass $joomla_up;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /jupyter/ {
        proxy_pass $jupyter_up;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }

    location /grafana/ {
        proxy_pass $grafana_up;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /jupyter { return 301 /jupyter/; }
    location = /grafana { return 301 /grafana/; }
}
